name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Wrapper y Compilar APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TVCastSignage-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "OmniCast TV Signage APK v1.0.0"
          body: "Descarga e instala el archivo app-debug.apk en tus televisores y celular."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
