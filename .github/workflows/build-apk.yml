name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Gradle Wrapper completo
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: Compilar APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TVCastSignage-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar Release en GitHub con el APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "OmniCast TV Signage APK v1.0.0"
          body: |
            ### 📺 OmniCast TV Signage APK
            Instala este archivo `app-debug.apk` tanto en tus televisores Android TV como en tu celular o tablet.
            - **En la TV:** Abre la app y configúrala como "Modo Televisor" (reproducción en bucle sin interfaz y arranque automático).
            - **En el Móvil:** Abre la app y selecciona "Modo Controlador" para prender las TVs y mandar videos.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
